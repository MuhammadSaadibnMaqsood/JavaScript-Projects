<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

        margin: 0;
        padding: 20px;
        min-height: 100vh;
      }

      .nav {
        display: flex;
        margin: 10px;
        padding: 5px;
        justify-content: space-around;
        background-color: black;
        color: white;
        border-radius: 10px;
        align-items: center;
        /* position: fixed; */
      }
      .nav-ul {
        display: flex;
        gap: 25px;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .nav-ul a {
        text-decoration: none;
        color: white;
      }
      .nav-item {
        position: relative;
        cursor: pointer;
        padding-bottom: 5px;
        color: #fff;
        font-weight: 500;
      }

      .nav-item .line {
        position: absolute;
        bottom: 10;
        left: 0;
        height: 2px;
        width: 0;
        background-color: #fff;
        transition: width 0.3s ease;
      }

      .nav-item:hover .line {
        width: 100%;
      }

      .login_Signup button {
        border: none;
        border-radius: 12px;
        padding: 5px 20px;
        background-color: #3b3b3b;
        color: #fff;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .login_Signup button a {
        text-decoration: none;
        color: #fff;
      }
      .login_Signup button:hover {
        background-color: #6a6867;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      .maincontainer {
        max-width: 1200px;
        margin: 40px auto;
        background: linear-gradient(135deg, #f5f7fa 0%, #d7deeaaf 100%);
        display: flex;
        gap: 40px;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .product-image {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 15px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      }

      .product-image img {
        width: 100%;
        height: 50vh;
        object-fit: cover;
        transition: transform 0.5s ease;
      }

      .product-image img:hover {
        transform: scale(1.03);
      }

      .product-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 10px;
      }

      .product-info h1 {
        margin: 0 0 15px 0;
        font-size: 2.5rem;
        background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
      }

      .price {
        font-size: 1.8rem;
        font-weight: bold;
        color: #e63946;
        margin: 15px 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .price::before {
        content: "₹";
        font-size: 1.5rem;
      }

      .description {
        font-size: 1.1rem;
        color: #555;
        margin-bottom: 30px;
        line-height: 1.6;
        padding: 15px;
        background: #f9f9f9;
        border-radius: 10px;
        border-left: 4px solid #667eea;
      }

      .action-buttons {
        display: flex;
        gap: 15px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 15px 25px;
        background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        border-radius: 8px;
        text-align: center;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      }

      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 7px 20px rgba(102, 126, 234, 0.4);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn-outline {
        background: transparent;
        border: 2px solid #667eea;
        color: #667eea;
        box-shadow: none;
      }

      .btn-outline:hover {
        background: rgba(102, 126, 234, 0.1);
      }

      .product-meta {
        display: flex;
        gap: 20px;
        margin: 20px 0;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
      }

      .meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #666;
      }

      .meta-item i {
        color: #667eea;
      }

      .rating {
        display: flex;
        gap: 5px;
        margin: 10px 0;
        color: #ffc107;
      }

      @media (max-width: 900px) {
        .maincontainer {
          flex-direction: column;
          gap: 30px;
        }

        .product-image img {
          height: 40vh;
        }
      }

      @media (max-width: 480px) {
        .maincontainer {
          margin: 20px auto;
          padding: 20px;
        }

        .product-info h1 {
          font-size: 2rem;
        }

        .action-buttons {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }

      footer {
        display: flex;
        justify-content: space-around;
        align-items: center;

        background-color: black;
        padding: 20px;
        margin: 10px;
        border-radius: 10px;
      }
      .links {
        display: flex;
        gap: 20px;
      }
      footer a {
        text-decoration: none;
        color: white;
      }
      footer p {
        color: white;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="nav">
        <div class="nav-left">
          <h1>HELLO</h1>
        </div>
        <div class="nav-mid">
          <ul class="nav-ul" id="nav-ul"></ul>
        </div>

        <div class="login_Signup">
          <button><a href="./login_Signup/login.html">Login</a></button>
        </div>
      </nav>
    </header>
    <div class="maincontainer" id="product-detail"></div>

    <footer>
      <div class="links">
        <div>
          <a href="">Home</a>
        </div>
        <div>
          <a href="">About</a>
        </div>
        <div>
          <a href="">All products</a>
        </div>
      </div>
      <div>
        <p>contact: 0123123</p>
        <p>email: muhammad@gmail.com</p>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
  </body>
</html>
