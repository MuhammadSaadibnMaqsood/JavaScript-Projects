<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Product</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background-color: #0e0e0e;
        background-image: radial-gradient(
          circle at top left,
          #222 0%,
          #000 100%
        );
        color: white;
      }

      /* ===== Navbar ===== */
      .nav {
        display: flex;
        margin: 10px;
        padding: 5px;
        justify-content: space-around;
        background-color: black;
        color: white;
        border-radius: 10px;
        align-items: center;
        /* position: fixed; */
      }
      .nav-ul {
        display: flex;
        gap: 25px;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .nav-ul a {
        text-decoration: none;
        color: white;
      }
      .nav-item {
        position: relative;
        cursor: pointer;
        padding-bottom: 5px;
        color: #fff;
        font-weight: 500;
      }

      .nav-item .line {
        position: absolute;
        bottom: 10;
        left: 0;
        height: 2px;
        width: 0;
        background-color: #fff;
        transition: width 0.3s ease;
      }

      .nav-item:hover .line {
        width: 100%;
      }

      .login_Signup button {
        border: none;
        border-radius: 12px;
        padding: 5px 20px;
        background-color: #3b3b3b;
        color: #fff;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .login_Signup button a {
        text-decoration: none;
        color: #fff;
      }
      .login_Signup button:hover {
        background-color: #6a6867;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      /* ===== Container ===== */
      .container {
        height: 90vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .container h2 {
        font-size: 28px;
        margin-bottom: 30px;
        background: linear-gradient(90deg, #00e0ff, #0077ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .container input[type="text"],
      .container input[type="number"] {
        width: 300px;
        padding: 12px 15px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background-color: #111;
        color: #fff;
        outline: none;
        font-size: 15px;
        transition: all 0.3s ease;
      }

      .container input:focus {
        border-color: #00e0ff;
        box-shadow: 0 0 8px rgba(0, 224, 255, 0.4);
      }

      /* ===== File Upload Box ===== */
      .upload-box {
        position: relative;
        width: 100px;
        height: 100px;
        margin: 20px auto;
        border-radius: 12px;
        background-color: rgba(17, 17, 17, 0.8);
        border: 2px dashed rgba(0, 224, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .upload-box:hover {
        background-color: rgba(17, 17, 17, 1);
        box-shadow: 0 0 20px rgba(0, 224, 255, 0.4);
      }

      .plus-icon {
        position: relative;
        width: 40px;
        height: 40px;
      }
      .img-render {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        z-index: 10;
        display: none;
      }

      .plus-icon::before,
      .plus-icon::after {
        content: "";
        position: absolute;
        background: linear-gradient(135deg, #00e0ff, #0077ff);
        border-radius: 2px;
        transition: 0.3s;
      }

      .plus-icon::before {
        width: 100%;
        height: 4px;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
      }

      .plus-icon::after {
        height: 100%;
        width: 4px;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
      }

      .upload-box:hover .plus-icon::before,
      .upload-box:hover .plus-icon::after {
        background: linear-gradient(135deg, #00ffa3, #0077ff);
        box-shadow: 0 0 10px rgba(0, 255, 200, 0.4);
      }

      #img {
        display: none;
      }

      /* ===== Button ===== */
      .container button {
        width: 300px;
        padding: 12px;
        background: linear-gradient(135deg, #00e0ff, #0077ff);
        border: none;
        border-radius: 8px;
        font-size: 16px;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .container button:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, #00ffa3, #0077ff);
        box-shadow: 0 0 15px rgba(0, 255, 200, 0.3);
      }
    </style>
  </head>

  <body>
    <header>
      <nav class="nav">
        <div class="nav-left"><h1>HELLO</h1></div>
        <div class="nav-mid">
          <ul class="nav-ul" id="nav-ul"></ul>
        </div>
        <div class="login_Signup">
          <button id="login-btn">Login</button>
        </div>
      </nav>
    </header>

    <div class="container">
      <h2>Upload Product</h2>
      <input id="name" type="text" placeholder="Enter product name" />
      <input id="price" type="number" placeholder="Enter price" />

      <label for="img" class="upload-box">
        <div class="plus-icon"></div>
        <img class="img-render" src="" alt="" />
      </label>
      <input id="img" type="file" />

      <button id="add-product">Add Product</button>
    </div>

    <script type="module" src="../script.js"></script>
    <script
      src="https://widget.cloudinary.com/v2.0/global/all.js"
      type="text/javascript"
    ></script>
    <script type="module" src="./owner.js"></script>
  </body>
</html>
