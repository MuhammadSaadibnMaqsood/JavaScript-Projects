<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Product</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      /* Custom Fonts */
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");

      :root {
        /* Theme Colors (White and flat) */
        --bg-main: #f4f7f9; /* Main body background (Slightly off-white) */
        --bg-light: #ffffff; /* Container/Card background (Pure white) */
        --highlight-color: #e5f4ff; /* Light blue highlight for hover/active */
        --text-color-dark: #333333; /* Dark text */
        --text-color-light: #6c757d; /* Lighter text for details */
        --primary-color: #007bff; /* Primary Accent Blue */
        --secondary-color: #28a745; /* Green for success */
      }

      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
        color: var(--text-color-dark);
      }

      body {
        background-color: var(--bg-main);
        min-height: 100vh;
      }

      /* ---------------------------------------------------- */
      /* ===== Navbar (Original Dark Theme) ===== */
      /* ---------------------------------------------------- */
      .nav {
        display: flex;
        margin: 10px;
        padding: 5px;
        justify-content: space-around;
        background-color: black;
        color: white;
        border-radius: 10px;
        align-items: center;
      }
      .nav-left h1 {
        color: white;
      }
      .nav-ul {
        display: flex;
        gap: 25px;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .nav-ul a {
        text-decoration: none;
        color: white;
      }
      .nav-item {
        position: relative;
        cursor: pointer;
        padding-bottom: 5px;
        color: #fff;
        font-weight: 500;
      }
      .nav-item .line {
        position: absolute;
        bottom: 10;
        left: 0;
        height: 2px;
        width: 0;
        background-color: #fff;
        transition: width 0.3s ease;
      }
      .nav-item:hover .line {
        width: 100%;
      }
      .login_Signup button {
        border: none;
        border-radius: 12px;
        padding: 5px 20px;
        background-color: #3b3b3b;
        color: #fff;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .login_Signup button a {
        text-decoration: none;
        color: #fff;
      }
      .login_Signup button:hover {
        background-color: #6a6867;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      /* ---------------------------------------------------- */
      /* ===== Main Container Layout (Dashboard Layout) ===== */
      /* ---------------------------------------------------- */
      .main-Container {
        display: flex;
        padding: 10px;
        gap: 10px;
        min-height: calc(100vh - 70px);
      }

      /* ===== Left Side (Sidebar) Styling - Copied from Dashboard ===== */
      .leftside {
        width: 280px;
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        background-color: var(--bg-light);
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .leftside a {
        text-decoration: none;
        color: var(--text-color-dark);
        width: 90%;
        min-height: 3.5rem;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding-left: 20px;
        justify-content: flex-start;
        transition: all 0.3s;
        font-weight: 500;
      }

      .leftside a:hover,
      .leftside a.active {
        background-color: var(--highlight-color);
        color: var(--primary-color);
        transform: translateX(5px);
      }

      .leftside a i {
        font-size: 20px;
        color: var(--primary-color);
      }

      .leftside a span {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .leftside a span span {
        font-size: 0.8em;
        color: var(--text-color-light);
      }

      /* ===== Right Side (Form Area) Styling ===== */
      .rightside {
        flex-grow: 1;
        padding: 20px;
        background-color: var(--bg-light);
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center; /* Center the form content vertically */
      }

      /* Form Container Styling */
      .container {
        width: 90%;
        max-width: 400px; /* Thoda chota kiya taaki form accha dikhe */
        padding: 40px 30px;
        text-align: center;
      }

      .container h2 {
        font-size: 28px;
        margin-bottom: 30px;
        color: var(--primary-color);
      }

      .container input[type="text"],
      .container input[type="number"] {
        width: 100%;
        padding: 12px 15px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        background-color: #f8f8f8;
        color: var(--text-color-dark);
        outline: none;
        font-size: 15px;
        transition: all 0.3s ease;
      }

      .container input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
      }

      /* ===== File Upload Box ===== */
      .upload-box {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 20px auto;
        border-radius: 12px;
        background-color: #f0f0f0;
        border: 2px dashed var(--primary-color);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .upload-box:hover {
        background-color: var(--highlight-color);
        box-shadow: 0 0 10px rgba(0, 123, 255, 0.2);
      }

      /* Plus Icon */
      .plus-icon {
        position: relative;
        width: 40px;
        height: 40px;
      }
      .img-render {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        z-index: 10;
        display: none;
        border-radius: 10px;
      }

      .plus-icon::before,
      .plus-icon::after {
        content: "";
        position: absolute;
        background-color: var(--primary-color);
        border-radius: 2px;
        transition: 0.3s;
      }

      .plus-icon::before {
        width: 100%;
        height: 4px;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
      }

      .plus-icon::after {
        height: 100%;
        width: 4px;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
      }

      .upload-box:hover .plus-icon::before,
      .upload-box:hover .plus-icon::after {
        background-color: var(--primary-color);
        box-shadow: 0 0 10px rgba(0, 123, 255, 0.4);
      }

      #img {
        display: none;
      }

      /* ===== Button ===== */
      .container button {
        width: 100%;
        padding: 12px;
        background-color: var(--secondary-color);
        border: none;
        border-radius: 8px;
        font-size: 16px;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 20px;
      }

      .container button:hover {
        transform: translateY(-2px);
        background-color: #218838;
        box-shadow: 0 4px 10px rgba(40, 167, 69, 0.4);
      }
    </style>
  </head>

  <body>
    <header>
      <nav class="nav">
        <div class="nav-left"><h1>HELLO</h1></div>
        <div class="nav-mid">
          <ul class="nav-ul" id="nav-ul"></ul>
        </div>
        <div class="login_Signup">
          <button id="login-btn">Login</button>
        </div>
      </nav>
    </header>

    <div class="main-Container">
      <div class="leftside">
        <a href="./dasboard.html" class="">
          <i class="fas fa-tachometer-alt"> </i>
          <span>Dashboard</span>
        </a>

        <a href="#">
          <i class="fas fa-user"> </i>
          <span>Muhammad Saad <span>saad@gmail.com</span></span>
        </a>
      </div>

      <div class="rightside">
        <div class="container">
          <h2>Upload New Product</h2>
          <input id="name" type="text" placeholder="Enter product name" />
          <input id="price" type="number" placeholder="Enter price" />

          <label for="img" class="upload-box">
            <div class="plus-icon"></div>
            <img class="img-render" src="" alt="" />
          </label>
          <input id="img" type="file" />

          <button id="add-product">Add Product</button>
        </div>
      </div>
    </div>

    <!-- <script type="module" src="../script.js"></script> -->
    <script
      src="https://widget.cloudinary.com/v2.0/global/all.js"
      type="text/javascript"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./owner.js"></script>
  </body>
</html>
