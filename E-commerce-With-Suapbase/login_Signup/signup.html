<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0e0e0e;
        background-image: radial-gradient(
          circle at top left,
          #222 0%,
          #000 100%
        );
      }

      .form-container {
        width: 380px;
        padding: 40px 35px;
        background: rgba(20, 20, 20, 0.9);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 25px rgba(0, 255, 255, 0.1);
        color: white;
        text-align: center;
        animation: slideUp 0.8s ease-out;
      }

      @keyframes slideUp {
        0% {
          opacity: 0;
          transform: translateY(40px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .form-container:hover {
        box-shadow: 0 0 35px rgba(0, 255, 255, 0.2);
      }

      .form-container h2 {
        font-size: 28px;
        margin-bottom: 30px;
        letter-spacing: 1px;
        background: linear-gradient(90deg, #00e0ff, #0077ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .form-container input {
        width: 100%;
        padding: 12px 15px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background-color: #111;
        color: #fff;
        outline: none;
        font-size: 15px;
        transition: all 0.3s ease;
      }

      .form-container input:focus {
        border-color: #00e0ff;
        box-shadow: 0 0 8px rgba(0, 224, 255, 0.4);
      }

      .form-container input::placeholder {
        color: #aaa;
      }

      .form-container button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        background: linear-gradient(135deg, #00e0ff, #0077ff);
        border: none;
        border-radius: 8px;
        font-size: 16px;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .form-container button:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, #00ffa3, #0077ff);
        box-shadow: 0 0 15px rgba(0, 255, 200, 0.3);
      }

      .form-container p {
        margin-top: 20px;
        font-size: 14px;
        color: #bbb;
      }

      .form-container p a {
        color: #00e0ff;
        font-weight: 600;
        text-decoration: none;
      }

      .form-container p a:hover {
        text-decoration: underline;
        color: #00ffa3;
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <h2>Create Account</h2>
      <input id="name" type="text" placeholder="Enter your full name" />
      <input id="email" type="email" placeholder="Enter your email" />
      <input id="password" type="password" placeholder="Create a password" />
      <input
        id="Confirm-password"
        type="password"
        placeholder="Confirm your password"
      />
      <button id="register-btn">Register</button>
      <p>Already have an account? <a href="./login.html">Login</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="loginSign.js"></script>
    <script type="module" src="../db.js"></script>
  </body>
</html>
